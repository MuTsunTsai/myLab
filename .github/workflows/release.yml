# 推送 v* tag 時建置佈景主題，並把 mylab.zip 發佈為 GitHub Release；
# 網站上的佈景主題會透過 inc/class-mylab-updater.php 偵測到新版本。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 檢查版本號
        run: node scripts/package.mjs --check "${GITHUB_REF_NAME#v}"

      - name: PHP 語法檢查
        run: find theme preview -name '*.php' -print0 | xargs -0 -n1 php -l

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm package

      - uses: softprops/action-gh-release@v3
        with:
          files: mylab.zip
          generate_release_notes: true
